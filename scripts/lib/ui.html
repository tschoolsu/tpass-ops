<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tpass 控制台</title>
<style>
  /* Bright Pop Tech / Neobrutalism，light-only，OKLCH（照 tpass-portal/docs/design.md） */
  :root {
    --bg: oklch(0.98 0.01 100);
    --fg: oklch(0.22 0.02 260);
    --primary: oklch(0.85 0.19 150);
    --accent: oklch(0.82 0.14 230);
    --rose: oklch(0.84 0.12 20);
    --violet: oklch(0.85 0.11 300);
    --amber: oklch(0.88 0.14 85);
    --card: oklch(1 0 0);
    --muted: oklch(0.55 0.02 260);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--fg);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif;
  }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-family: ui-monospace, "Geist Mono", monospace; font-size: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 2px solid var(--fg); border-radius: 14px;
    box-shadow: 5px 5px 0 0 var(--fg); padding: 16px;
    transition: transform .1s, box-shadow .1s;
  }
  .card:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 0 var(--fg); }
  .card.disabled { opacity: .55; }
  .cardTop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .svcName { font-weight: 800; font-size: 17px; }
  .badge {
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
    border: 2px solid var(--fg); border-radius: 999px; padding: 2px 9px;
  }
  .up   { background: var(--primary); }
  .downb{ background: var(--card); color: var(--muted); }
  .meta { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); margin: 10px 0 12px; line-height: 1.7; }
  .meta a { color: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    border: 2px solid var(--fg); border-radius: 10px; padding: 6px 12px;
    background: var(--card); box-shadow: 3px 3px 0 0 var(--fg);
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 0 var(--fg); }
  button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 0 var(--fg); }
  .bDev { background: var(--primary); } .bCheck { background: var(--amber); }
  .bDeploy { background: var(--rose); } .bLogs { background: var(--accent); }
  .bEnv { background: var(--violet); } .bDb { background: var(--amber); }
  .envPanel {
    margin-top: 12px; border: 2px solid var(--fg); border-radius: 10px; padding: 10px;
    background: var(--bg); font-family: ui-monospace, "Geist Mono", monospace; font-size: 12px;
  }
  .envHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; word-break: break-all; }
  .envHead button { font-size: 11px; padding: 3px 8px; box-shadow: 2px 2px 0 0 var(--fg); }
  .envRow { padding: 2px 0; word-break: break-all; line-height: 1.5; }
  .envRow .k { font-weight: 700; }
  .envRow .del { border: none; background: none; box-shadow: none; padding: 0 4px; cursor: pointer; }
  .envSet { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .envSet input {
    font: inherit; font-size: 12px; border: 2px solid var(--fg); border-radius: 8px; padding: 4px 8px;
    background: var(--card);
  }
  .envSet input.k { width: 40%; } .envSet input.v { flex: 1; min-width: 90px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 26px; }
  .toolbar button { background: var(--violet); }
  #out {
    margin-top: 26px; background: var(--fg); color: oklch(0.95 0.02 150);
    border: 2px solid var(--fg); border-radius: 14px; box-shadow: 5px 5px 0 0 oklch(0.7 0.05 260);
    padding: 14px 16px; min-height: 130px; max-height: 46vh; overflow: auto;
    font-family: ui-monospace, "Geist Mono", Menlo, monospace; font-size: 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all;
  }
  #outHead { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; }
  #outHead + #out { margin-top: 10px; }
  #outTitle { font-family: ui-monospace, monospace; font-weight: 700; font-size: 13px; }
  #stopBtn { background: var(--rose); display: none; }
</style>
</head>
<body>
  <h1>tpass 控制台 🎛</h1>
  <div class="sub" id="rootLine">services.json 驅動 · 只綁 127.0.0.1</div>

  <div class="toolbar">
    <button onclick="run(['status'])">📊 全域狀態（本機 + 主機 pm2）</button>
    <button onclick="run(['check','all'])">🧪 全部檢查（lint + tsc）</button>
    <button onclick="run(['build','all'])">🔨 全部 build</button>
    <button onclick="confirmRun(['deploy','all'],'確定部署全部服務到正式主機？')">🚀 全部部署</button>
  </div>

  <div class="grid" id="grid"></div>

  <div id="outHead">
    <span id="outTitle">輸出</span>
    <button id="stopBtn" onclick="stopJob()">⏹ 停止</button>
  </div>
  <div id="out">（按上面的按鈕開始）</div>

<script>
const TOKEN = "__TOKEN__";
const api = (p, opts) => fetch(p + (p.includes("?") ? "&" : "?") + "token=" + TOKEN, opts);
let curJob = null, curSrc = null;
const openEnv = new Set(); // 展開中的 env 面板（15s 刷新後要重開）
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadRegistry() {
  const r = await (await api("/api/registry")).json();
  document.getElementById("rootLine").textContent = r.root + " · services.json 驅動 · 只綁 127.0.0.1";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const s of r.services) {
    const card = document.createElement("div");
    card.className = "card" + (s.enabled ? "" : " disabled");
    card.innerHTML = `
      <div class="cardTop">
        <span class="svcName">${s.name}</span>
        <span class="badge ${s.devUp ? "up" : "downb"}">${s.enabled ? (s.devUp ? "dev 🟢" : "dev ⚪") : "停用"}</span>
      </div>
      <div class="meta">
        ${s.dir} · ${s.external ? "外部託管（GitHub Pages）" : ":" + s.port}${s.db ? " · 🗄 " + s.db : ""}${s.deployed ? "" : " · <b>未上線</b>"}<br>
        <a href="${s.devUrl}" target="_blank">${s.devUrl}</a>
      </div>
      <div class="btns">
        ${s.external ? "" : `
        <button class="bDev" onclick="run(['dev','${s.id}'])">▶ dev</button>
        <button class="bCheck" onclick="run(['check','${s.id}'])">🧪 check</button>
        <button class="bLogs" onclick="run(['logs','${s.id}'])">📜 logs</button>`}
        <button class="bEnv" onclick="toggleEnv('${s.id}')">🔧 env</button>
        ${s.db ? `<button class="bDb" onclick="confirmRun(['db','create','${s.id}'],'在主機建立/確保 ${s.id} 的資料庫？（冪等，會寫入遠端 DATABASE_URL）')">🗄 建 DB</button>` : ""}
        ${s.deployed && !s.external ? `<button class="bDeploy" onclick="confirmRun(['deploy','${s.id}'],'部署 ${s.id} 到正式主機？')">🚀 deploy</button>` : ""}
      </div>
      <div class="envPanel" id="env-${s.id}" style="display:none"></div>`;
    grid.appendChild(card);
  }
  for (const id of openEnv) { const p = document.getElementById("env-" + id); if (p) { p.style.display = "block"; loadEnv(id, false); } }
}

function confirmRun(argv, msg) { if (window.confirm(msg)) run(argv); }

function toggleEnv(id) {
  const panel = document.getElementById("env-" + id);
  if (panel.style.display !== "none") { panel.style.display = "none"; openEnv.delete(id); return; }
  panel.style.display = "block";
  openEnv.add(id);
  loadEnv(id, false);
}

async function loadEnv(id, reveal) {
  const panel = document.getElementById("env-" + id);
  const r = await (await api("/api/env/" + id + (reveal ? "?reveal=1" : ""))).json();
  if (r.error) { panel.innerHTML = "✗ " + escapeHtml(r.error); return; }
  const rows = r.entries.map((e) =>
    `<div class="envRow"><span class="k">${escapeHtml(e.key)}</span>=${escapeHtml(e.value)}` +
    `<button class="del" title="移除" onclick="delEnv('${id}','${escapeHtml(e.key)}')">🗑</button></div>`
  ).join("");
  panel.innerHTML =
    `<div class="envHead"><span>${escapeHtml(r.path)}</span>` +
    `<button onclick="loadEnv('${id}',${!reveal})">${reveal ? "🙈 遮罩" : "👁 顯示密文"}</button></div>` +
    (rows || "<i>（空或不存在）</i>") +
    `<div class="envSet"><input class="k" id="ek-${id}" placeholder="KEY" />` +
    `<input class="v" id="ev-${id}" placeholder="value" />` +
    `<button onclick="saveEnv('${id}')">💾 設定</button></div>`;
}

async function saveEnv(id) {
  const key = document.getElementById("ek-" + id).value.trim();
  const value = document.getElementById("ev-" + id).value;
  if (!key) return;
  if (!window.confirm(`寫入主機 ${id} 的 .env.local：${key}=…？（套用需之後 deploy）`)) return;
  const r = await (await api("/api/env/" + id, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ key, value }),
  })).json();
  if (r.error) { alert("✗ " + r.error); return; }
  loadEnv(id, false);
}

async function delEnv(id, key) {
  if (!window.confirm(`從主機 ${id} 的 .env.local 移除 ${key}？`)) return;
  const r = await (await api("/api/env/" + id, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ unset: true, key }),
  })).json();
  if (r.error) { alert("✗ " + r.error); return; }
  loadEnv(id, false);
}

async function run(argv) {
  const out = document.getElementById("out");
  document.getElementById("outTitle").textContent = "輸出 — tpass " + argv.join(" ");
  out.textContent = "";
  const r = await (await api("/api/run", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ argv }),
  })).json();
  if (!r.id) { out.textContent = "✗ " + (r.error || "啟動失敗"); return; }
  curJob = r.id;
  document.getElementById("stopBtn").style.display = "inline-block";
  if (curSrc) curSrc.close();
  curSrc = new EventSource("/api/stream/" + r.id + "?token=" + TOKEN);
  curSrc.onmessage = (e) => {
    out.textContent += JSON.parse(e.data) + "\n";
    out.scrollTop = out.scrollHeight;
  };
  curSrc.addEventListener("done", () => {
    document.getElementById("stopBtn").style.display = "none";
    curSrc.close();
    loadRegistry(); // 動作完刷新卡片狀態（dev 起停會改變 port 探測）
  });
}

async function stopJob() {
  if (curJob) await api("/api/stop/" + curJob, { method: "POST" });
}

loadRegistry();
setInterval(loadRegistry, 15000);
</script>
</body>
</html>
