# 手動觸發的部署 workflow。做的事跟本機 `tpass deploy` 一模一樣
# （ssh 進主機 → ./deploy/deploy.sh <svc>），只是換一個發動的地方——
# 部署不再需要部長的筆電與他那把金鑰，任何有本 repo 寫入權的人都能按。
# 本機 `scripts/tpass deploy` 保留不動，是這條管道壞掉時的逃生路徑。
name: deploy

# workflow_dispatch = 只能由人在 GitHub 網頁手動按（要有 repo 寫入權）。
# 刻意沒有 push / pull_request 觸發：部署永遠是刻意的動作，
# 不會因為誰推了 code 就自己跑上正式主機。
on:
  workflow_dispatch:
    inputs:
      service:
        description: "服務 id（all = 註冊表裡所有 deployed:true 的；ping = 只測連線不部署）"
        required: true
        default: "all"
        type: string

# 同時只准一個部署在跑。兩個人同時按不會在主機上互相踩。
concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 服務清單的唯一真相是 tpass-registry（public repo），不在這裡硬編碼。
      # 新服務上線 / 翻 deployed 時，這個檔案一行都不用改。
      - name: 驗證服務 id（對照 tpass-registry）
        env:
          # ⚠️ 一定要經 env 傳。把 ${{ inputs.service }} 直接寫進 run: 裡，
          # 輸入框打 `a; rm -rf ~` 就會在 runner 上執行（Actions 最經典的 script injection）。
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/tschoolsu/tpass-registry/main/services.json -o /tmp/services.json
          valid="all ping $(jq -r '.services[] | select(.deployed) | .id' /tmp/services.json | tr '\n' ' ')"
          for v in $valid; do
            if [ "$v" = "$SERVICE" ]; then
              echo "✓ 服務 id「${SERVICE}」在註冊表裡"
              exit 0
            fi
          done
          echo "✗ 未知或未上線的服務「${SERVICE}」" >&2
          echo "  可用：$valid" >&2
          exit 1

      # runner 是 GitHub 的一台全新電腦，什麼都不知道。這一步把「主機在哪、
      # 用誰的身分、憑什麼相信對方」三樣東西從 Secrets 佈到它的 ~/.ssh。
      - name: 設定 SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519   # 只印指紋，確認金鑰完整讀進來了

      # 主機上那把金鑰被 authorized_keys 的 command="…/ci-deploy.sh" 綁死，
      # 所以這裡送過去的字串只會被當成服務 id，不會被當指令執行。
      #
      # known_hosts 走 Secrets 而不是 StrictHostKeyChecking=accept-new：
      # 後者是首次連線就無條件信任；而且主機位址本身是機密，
      # 不該出現在這個 public repo 的明文 workflow 檔裡。
      - name: 部署
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          SERVICE: ${{ inputs.service }}
        run: ssh -o StrictHostKeyChecking=yes "$USERNAME@$HOST" "$SERVICE"
